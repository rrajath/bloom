name: Build & Release

# What runs depends on the trigger, cheapest first:
#   - Any push (any branch) or PR: unit tests + assembleDebug only. This is
#     the regression net; the expensive release/bundle/R8 work is skipped.
#     The debug APK is still uploaded as a CI artifact for sideload testing.
#   - Push to the default branch: the above PLUS assembleRelease (no bundle,
#     no publish). R8/ProGuard and signing-config breakage is caught here, at
#     merge time, instead of only when a release is cut.
#   - Push a version tag matching v*.*.* (e.g. `git tag v1.2.0 && git push
#     origin v1.2.0`), or a manual "Run workflow" dispatch against the default
#     branch: the full path — assembleRelease + bundleRelease + publish a
#     GitHub Release (tag + both APKs + the AAB).
# So several pushes with unrelated fixes can land before you choose to cut and
# distribute a release. `branches: ['**']` is listed alongside `tags` below
# because specifying only `tags` would stop plain branch pushes from
# triggering this workflow at all.
# docs-site/ is excluded: it's a separate Astro/Starlight site deployed via
# Cloudflare Pages (which has its own build watch path on docs-site/**), so an
# app CI run here would be redundant for docs-only changes. paths-ignore has
# no effect on tag pushes (GitHub doesn't evaluate path filters for tags), so
# a version tag always triggers regardless of what it touches.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
    paths-ignore:
      - 'docs-site/**'
  pull_request:
    paths-ignore:
      - 'docs-site/**'
  workflow_dispatch:
  # Nightly run of the Layer-2 Compose UI tests (ui-tests job below) on an
  # emulator — too slow for the per-push net. Also reachable via "Run workflow".
  schedule:
    - cron: '0 6 * * *'

# contents: write is needed to create the release and its tag.
permissions:
  contents: write

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The scheduled trigger is only for the ui-tests job; skip the build/release
    # work on it.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      # Signing only kicks in once the keystore secret is configured AND the
      # alias/passwords are valid; otherwise the release build stays unsigned
      # (build.gradle.kts validates and degrades gracefully) and CI stays green.
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The M3 Robolectric integration tests download one `android-all-*.jar`
      # (~100 MB) per SDK level into ~/.m2 on first run. Cache them so per-push
      # `testDebugUnitTest` runs don't re-fetch from Maven Central (a network
      # blip there fails the whole test class). The key must cover every SDK
      # the tests run on, not just the Robolectric version: actions/cache never
      # re-saves on an exact key hit, so a newly added `@Config(sdk = [N])` jar
      # would otherwise be downloaded on every run forever. setup-gradle already
      # caches the Gradle module cache, where the sqlite-bundled JVM natives land.
      - name: Compute Robolectric cache key
        id: robolectric-key
        run: |
          key=$( { grep -rhoE 'sdk ?= ?\[[^]]*\]' app/src/test || true; grep -E '^robolectric' gradle/libs.versions.toml; cat app/src/test/resources/robolectric.properties; } | sort -u | sha256sum | cut -c1-16 )
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache Robolectric runtime jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ steps.robolectric-key.outputs.key }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Computed once here and reused for the GitHub Release tag/title below.
      #
      # Two ways to reach this workflow with release intent, and each picks its
      # own release tag / changelog version:
      #   - A pushed tag (refs/tags/v*.*.*): RELEASE_TAG is exactly the tag you
      #     pushed, and CHANGELOG_VERSION is that tag with its leading "v"
      #     stripped. The release-notes step below fails the run unless
      #     versionName and the CHANGELOG.md heading both match it
      #     (scripts/release.sh sets both before tagging).
      #   - workflow_dispatch on the default branch: RELEASE_TAG is v$VERSION
      #     (versionName). Re-dispatching without first bumping versionName
      #     builds and tests only; it never replaces an existing release's
      #     assets (see "Publish GitHub Release").
      - name: Compute version
        run: |
          set -euo pipefail
          VERSION="$(./gradlew -q printVersionName | tail -n1)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Local shell vars first, then written to GITHUB_ENV once at the end:
          # GITHUB_ENV writes only take effect for *later* steps, so the
          # SHOULD_RELEASE check below can't read IS_TAG_RELEASE back out of it
          # within this same step.
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            IS_TAG_RELEASE=true
            RELEASE_TAG="$TAG_NAME"
            CHANGELOG_VERSION="${TAG_NAME#v}"
          else
            IS_TAG_RELEASE=false
            RELEASE_TAG="v$VERSION"
            CHANGELOG_VERSION="$VERSION"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            SHOULD_RELEASE=true
          elif [ "$IS_TAG_RELEASE" = "true" ]; then
            SHOULD_RELEASE=true
          else
            SHOULD_RELEASE=false
          fi
          # assembleRelease (R8 + signing config) also runs on a plain push to
          # the default branch, even though nothing is published then — it's
          # the cheapest place to catch release-only breakage before a tag is
          # cut. bundleRelease and the publish stay gated on SHOULD_RELEASE.
          if [ "$SHOULD_RELEASE" = "true" ]; then
            BUILD_RELEASE=true
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            BUILD_RELEASE=true
          else
            BUILD_RELEASE=false
          fi
          echo "IS_TAG_RELEASE=$IS_TAG_RELEASE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "CHANGELOG_VERSION=$CHANGELOG_VERSION" >> "$GITHUB_ENV"
          echo "SHOULD_RELEASE=$SHOULD_RELEASE" >> "$GITHUB_ENV"
          echo "BUILD_RELEASE=$BUILD_RELEASE" >> "$GITHUB_ENV"

      # CI never edits CHANGELOG.md. It's bundled into the APK (What's New), so
      # the release must be built from the committed file byte-for-byte:
      # F-Droid rebuilds from the tag and compares against the published APK.
      # scripts/release.sh archives `## [Unreleased]` as
      # `## [<version>] - <date>` and bumps versionName in the tagged commit;
      # this step only checks that it did, and pulls that section's content
      # (not the header) into GITHUB_ENV via the multiline heredoc form so
      # Publish can reuse it verbatim as release notes.
      #
      # A pushed tag without a matching heading or versionName fails the run
      # (it would publish an APK whose What's New and version disagree with
      # the tag). A dispatch without a `## [<versionName>]` heading just
      # builds and tests, with no release.
      - name: Read release notes from CHANGELOG.md
        if: env.SHOULD_RELEASE == 'true'
        run: |
          set -euo pipefail
          HEADING="## [$CHANGELOG_VERSION] - "
          if ! awk -v h="$HEADING" 'index($0, h) == 1 { found=1 } END { exit !found }' CHANGELOG.md; then
            if [ "$IS_TAG_RELEASE" = "true" ]; then
              echo "::error::CHANGELOG.md has no '$HEADING<date>' heading at $RELEASE_TAG. Cut releases with scripts/release.sh."
              exit 1
            fi
            echo "HAS_RELEASE=false" >> "$GITHUB_ENV"
            echo "No '$HEADING<date>' heading in CHANGELOG.md; run scripts/release.sh first. Skipping release for this run."
            exit 0
          fi
          if [ "$VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "::error::versionName is $VERSION but the tag is $RELEASE_TAG. Cut releases with scripts/release.sh."
            exit 1
          fi
          NOTES="$(awk -v h="$HEADING" '
            index($0, h) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | awk 'NF{p=1} p')"
          if [ -z "$NOTES" ]; then
            NOTES="(no changelog entry)"
          fi
          echo "HAS_RELEASE=true" >> "$GITHUB_ENV"
          {
            echo "RELEASE_NOTES<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_ENV"

      - name: Decode release keystore
        if: env.HAS_SIGNING == 'true' && env.BUILD_RELEASE == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      # Always built: the regression net, and the artifact used for sideload
      # testing a branch.
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # assembleRelease runs R8 / resource shrinking against the ProGuard keep
      # rules and exercises the signing config — the release-only failure modes
      # (e.g. R8 dropping a reflectively-constructed class). BUILD_RELEASE is
      # true on any push to the default branch, so this is caught at merge
      # time, not only when a release tag is pushed.
      - name: Build release APK
        if: env.BUILD_RELEASE == 'true'
        env:
          # Empty when no keystore secret is set → build.gradle.kts leaves the
          # release build unsigned.
          SIGNING_KEYSTORE_PATH: ${{ env.HAS_SIGNING == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # bundleRelease produces the .aab Play Console requires for submission
      # (Play no longer accepts a bare APK for new apps). Only needed on the
      # release path, so it's gated on SHOULD_RELEASE rather than BUILD_RELEASE.
      - name: Build release AAB
        if: env.SHOULD_RELEASE == 'true'
        env:
          SIGNING_KEYSTORE_PATH: ${{ env.HAS_SIGNING == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # CI-only APK naming: bloom-<RELEASE_TAG>-<variant>.apk (e.g.
      # bloom-v1.2.3-release.apk). RELEASE_TAG is the pushed tag for a tag
      # release and v$VERSION otherwise, so the file name always matches the
      # GitHub Release it lands in. Local Gradle builds keep AGP's default
      # app-<variant>.apk names. The release APK is app-release-unsigned.apk
      # when no keystore secret is set; it gets the same name either way.
      # The AAB (release path only) is named bloom-<RELEASE_TAG>-release.aab
      # (e.g. bloom-v1.2.3-release.aab), the same tag form as the APKs.
      # Releases up to v1.10.0 used grove-* names (and a "v"-less AAB name);
      # F-Droid's metadata pins those old builds to their old asset names.
      - name: Rename APKs and AAB
        run: |
          set -euo pipefail
          for VARIANT in debug release; do
            DIR="app/build/outputs/apk/$VARIANT"
            [ -d "$DIR" ] || continue
            APKS=("$DIR"/*.apk)
            if [ "${#APKS[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one $VARIANT APK, found: ${APKS[*]}"
              exit 1
            fi
            mv "${APKS[0]}" "$DIR/bloom-$RELEASE_TAG-$VARIANT.apk"
          done
          ls app/build/outputs/apk/*/*.apk
          BUNDLE_DIR="app/build/outputs/bundle/release"
          if [ -d "$BUNDLE_DIR" ]; then
            AABS=("$BUNDLE_DIR"/*.aab)
            if [ "${#AABS[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one release AAB, found: ${AABS[*]}"
              exit 1
            fi
            mv "${AABS[0]}" "$BUNDLE_DIR/bloom-$RELEASE_TAG-release.aab"
            ls "$BUNDLE_DIR"/*.aab
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: env.BUILD_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        if: env.SHOULD_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Releases are manual-only: dispatching this workflow from any other ref
      # just builds and tests, same as a push does, with no release step.
      - name: Warn if dispatched off the default branch
        if: github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: echo "::warning::Manually run from '${{ github.ref_name }}', not the default branch. Building and testing only, no release will be published."

      # Publish a GitHub Release with both APKs and the AAB, but only when
      # CHANGELOG.md has a heading for this version (see "Read release notes
      # from CHANGELOG.md" above). RELEASE_TAG is the tag you pushed for a tag
      # release, or "v$VERSION" (versionName) for a dispatch; either way the
      # tag lands on the commit that was built. Re-runs of a tag push rebuild
      # the tagged commit, so they safely re-upload assets to its release.
      # A dispatch never touches an existing release: main has usually moved
      # past the tag by then, and clobbering the assets with a newer build
      # breaks F-Droid's reproducible-build check for that version (this
      # happened to v1.8.1). Cut a new version with scripts/release.sh instead.
      - name: Publish GitHub Release
        if: env.SHOULD_RELEASE == 'true' && env.HAS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          TITLE="$RELEASE_TAG"
          NOTES="$(printf '%s\n\n_Commit: %s_' "$RELEASE_NOTES" "${GITHUB_SHA:0:7}")"
          # APKs were renamed to bloom-<RELEASE_TAG>-<variant>.apk and the AAB to
          # bloom-<RELEASE_TAG>-release.aab by "Rename APKs and AAB" above.
          # The AAB is attached too so a signed one is available to upload to Play Console
          # without a separate local build.
          ASSETS=$(ls app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab)
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$IS_TAG_RELEASE" != "true" ]; then
              echo "::warning::Release $TAG already exists; a manual run never replaces its assets. Built and tested only."
              exit 0
            fi
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

  # Layer-2 Compose UI tests (internal/test-suite-02-ui-compose.md). They need
  # an emulator, so they run nightly on a schedule or on a manual "Run workflow"
  # dispatch — never on the per-push regression net.
  ui-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Bracket the supported range: minSdk (23) runs every pre-N/pre-O
      # fallback branch, targetSdk (36) runs the current-device behavior.
      # Levels in between take the same branches as 36, so they add little.
      matrix:
        api-level: [23, 36]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # KVM is required for a hardware-accelerated emulator on the Ubuntu runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Compose UI tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          # android-emulator-runner runs each line of `script` as its own
          # `sh -c`, so this must stay a single compound command: logcat is
          # streamed to a file for the whole run and the gradle exit status is
          # preserved, so a "Test instrumentation process crashed" (which leaves
          # no stack in the HTML report) can be diagnosed from the uploaded
          # logcat / tombstones instead of only from a green-or-red bit.
          # The logcat process is killed by PID, not `pkill -f "adb logcat"` --
          # that pattern also matches this very `sh -c` command line (it contains
          # the string "adb logcat"), so pkill would signal-kill its own parent
          # shell before `exit $STATUS` and the step would die with "exit code
          # null" even on a fully green run.
          script: >-
            adb logcat -c || true;
            adb logcat > "$RUNNER_TEMP/logcat-api${{ matrix.api-level }}.txt" 2>&1 &
            LOGCAT_PID=$!;
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.package=com.rrajath.grove.ui;
            STATUS=$?;
            kill "$LOGCAT_PID" 2>/dev/null || true;
            adb pull /data/tombstones "$RUNNER_TEMP/tombstones-api${{ matrix.api-level }}" 2>/dev/null || true;
            exit $STATUS

      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report-api${{ matrix.api-level }}
          # reports/ is the HTML; outputs/androidTest-results/ holds the raw
          # per-test .txt / logcat / protobuf UTP writes (where a process-crash
          # note actually lands); the logcat and tombstones are the run-wide
          # capture from the step above.
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            ${{ runner.temp }}/logcat-api${{ matrix.api-level }}.txt
            ${{ runner.temp }}/tombstones-api${{ matrix.api-level }}/**
          if-no-files-found: warn

  # Layer-3 Maestro end-to-end journeys (internal/test-suite-03-e2e-maestro.md).
  # Manual "Run workflow" only — the slowest layer, and journey 02's capture path
  # can be timing-sensitive. Flows 02-04 use the debug build's test-vault hook
  # (--ez grove_test_direct_vault true) to skip onboarding and the SAF picker;
  # journey 01 (the SAF system dialog) is not built yet.
  #
  # Alternative: mobile-dev-inc/action-maestro-cloud@v1 with a MAESTRO_CLOUD_API_KEY
  # secret runs the flows on Maestro Cloud's managed devices instead of the
  # emulator step below.
  e2e-maestro:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Maestro's on-device driver needs API 24+ (minSdk 24, adb shell_v2), so
      # this brackets at 24 rather than minSdk 23; ui-tests still covers 23.
      matrix:
        api-level: [24, 36]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Maestro's on-device driver can take well over its default to start
          # on a software-rendered runner emulator (milliseconds).
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          # Plain AOSP image (no Gboard) — the flows' hideKeyboard steps assume
          # the AOSP keyboard, not Gboard's first-run popup / floating toolbar.
          target: default
          # A tall phone, like the Pixel_9a AVD the flows are verified on. The
          # runner's default AVD is much shorter, which pushes rows below the
          # fold and breaks taps/asserts that pass locally.
          profile: pixel_6
          disable-animations: true
          # One compound command (each `script` line is its own `sh -c`), so the
          # maestro exit status survives to the end of the step.
          script: >-
            .maestro/scripts/ci-settle-emulator.sh &&
            adb install -r app/build/outputs/apk/debug/app-debug.apk &&
            maestro test .maestro/flows
            --format junit --output maestro-report-api${{ matrix.api-level }}.xml
            --test-output-dir maestro-artifacts-api${{ matrix.api-level }}
            --debug-output maestro-debug-api${{ matrix.api-level }} --flatten-debug-output

      # Screenshots, per-command logs and the failing step's view hierarchy, so a
      # CI-only failure can be diagnosed without re-running it locally.
      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report-api${{ matrix.api-level }}
          path: |
            maestro-report-api${{ matrix.api-level }}.xml
            maestro-artifacts-api${{ matrix.api-level }}/**
            maestro-debug-api${{ matrix.api-level }}/**
            ~/.maestro/tests/**
          if-no-files-found: warn

  # NOTE: the Macrobenchmark + Baseline Profile suite (:macrobenchmark) is
  # deliberately NOT run in CI. Benchmark numbers off a shared-runner emulator
  # are pure noise, and standing the suite up on CI cost more maintenance than it
  # was worth (repeated cold-start re-seed/re-index flakiness, the androidx
  # EMULATOR guard, and so on). Run it locally on a real device instead, per the
  # "Performance benchmarks" section in README.md.
