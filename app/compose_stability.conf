// Compose compiler stability configuration.
//
// Only types the compiler can't infer as stable belong here. Domain types that
// carry collections (OrgKeywords, ArchiveTarget, SyncResult) hold
// kotlinx.collections.immutable types instead, so the compiler proves their
// stability itself; don't add a type here just because it holds a plain List.

// java.time values are immutable, but they come from a module the Compose
// compiler didn't process.
java.time.LocalDate
java.time.LocalTime
java.time.LocalDateTime

// All-val value type built only from the java.time types above.
com.rrajath.grove.org.OrgTimestamp

// Sealed sync progress state carried inside NotebooksUiState: every subtype is
// an immutable data class or object, but the compiler doesn't infer stability
// for a sealed parent type.
com.rrajath.grove.sync.SyncState
